openapi: 3.0.0
info:
  title: Eslint Plugin Service
  description: |
    A service that accepts incoming pings. This is only used for testing.

    © Check Digit LLC. 2019-2026
  version: 1.0.0
  contact:
    name: Check Digit
servers:
  - url: /eslint-athena-plugin/v1

tags:
  - name: Service Health
  - name: API

x-firehose-logged: true

paths:
  /ping:
    get:
      description: Test service connectivity
      tags:
        - Service Health
      operationId: ping-get
      responses:
        '200':
          $ref: '#/components/responses/Ping'
        default:
          $ref: '#/components/responses/ServerError'
    head:
      description: Test service connectivity
      tags:
        - Service Health
      operationId: ping-head
      responses:
        '200':
          description: ping HEAD successful
          content:
            application/json:
              schema: {}
        default:
          $ref: '#/components/responses/ServerError'

  /request/{messageId}:
    put:
      tags:
        - API
      x-firehose-logged: true
      operationId: 'request-put'
      description: Creates a Request resource.
      parameters:
        - $ref: '#/components/parameters/messageId'
        - $ref: '#/components/parameters/createdOn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRequest'
      responses:
        '204':
          description: Operation successful.
          content:
            application/json:
              schema: {}
          headers:
            Created-On:
              $ref: '#/components/headers/Created-On'
            Updated-On:
              $ref: '#/components/headers/Updated-On'
        default:
          $ref: '#/components/responses/ServerError'

  /entry/{entryId}:
    put:
      tags:
        - API
      operationId: 'entry-put'
      x-firehose-logged: true
      description: >-
        Creates a journal entry with a specific id. This operation is
        idempotent.
      parameters:
        - $ref: '#/components/parameters/entryId'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/createdOn'
        - $ref: '#/components/parameters/lastModified'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntry'
      responses:
        '204':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreConditionFailed'
        default:
          $ref: '#/components/responses/ServerError'
    get:
      tags:
        - API
      operationId: 'entry-get'
      description: Obtains a journal entry with a specified id.
      parameters:
        - $ref: '#/components/parameters/entryId'
        - $ref: '#/components/parameters/at'
      responses:
        '200':
          description: Entry obtained successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntry'
          headers:
            Created-On:
              $ref: '#/components/headers/Created-On'
            Updated-On:
              $ref: '#/components/headers/Updated-On'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'

  /card/{cardId}:
    get:
      tags:
        - API
      operationId: 'card-get'
      description: Retrieves a card by id.
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/at'
        - $ref: '#/components/parameters/publicKeyHashQuery'
      responses:
        '200':
          $ref: '#/components/responses/CardResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
    put:
      x-firehose-logged: true
      tags:
        - API
      operationId: 'card-put'
      description: Creates a new card.
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/createdOn'
        - $ref: '#/components/parameters/lastModified'
      requestBody:
        $ref: '#/components/requestBodies/NewCardRequest'
      responses:
        '200':
          $ref: '#/components/responses/CardResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    Ping:
      type: object
      additionalProperties: false
      required:
        - serverTime
        - v1Only
      properties:
        serverTime:
          type: string
          format: date-time
          description: Current server time
        v1Only:
          type: boolean
          description: Indicates if the server is running in v1-only mode

    Error:
      type: object
      additionalProperties: false
      description: Error message
      properties:
        message:
          type: string
        code:
          type: string

    MessageId:
      description: |
        Uniquely identifies a message stored in the platform.

        A message's request and response are stored and retrieved separately using this identifier.
      type: string

    NewRequest:
      type: object
      additionalProperties: false
      required:
        - messageId
        - feeDetails
      description: The incoming message request data received from the network to be processed.
      properties:
        messageId:
          $ref: '#/components/schemas/MessageId'
        feeDetails:
          type: array
          description: Details about the fees that went into the transaction and settlement fee amounts
          items:
            $ref: '#/components/schemas/Fee'

    Fee:
      type: object
      description: Details about the fees applied to the transaction and settlement amounts.
      additionalProperties: false
      required:
        - type
        - application
        - transaction
        - settlement
      properties:
        type:
          $ref: '#/components/schemas/FeeType'
        application:
          $ref: '#/components/schemas/FeeApplication'
        transaction:
          $ref: '#/components/schemas/Amount'
        settlement:
          $ref: '#/components/schemas/Amount'

    FeeType:
      type: string
      description: The type of fee being applied to the transaction.
      enum:
        - CONVENIENCE
        - TRANSACTION
        - CURRENCY CONVERSION ASSESSMENT
        - ISSUER CURRENCY CONVERSION ASSESSMENT
        - SURCHARGE
        - OPTIONAL ISSUER
        - PROCESSING
        - FOREIGN EXCHANGE

    FeeApplication:
      type: string
      description: |
        Indicates whether the fee should be applied to a cardholder's account (SETTLE) or recorded for information
        purposes only (MEMO). Examples of MEMO fees are currency conversion fees (already in the settlement amount) and
        interchange fees.
      enum:
        - MEMO
        - SETTLE

    Amount:
      type: object
      additionalProperties: false
      description: |
        An amount of money in the smallest monetary unit of the specified currency.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: '^[0-9]+$'
          description: The amount of money in the smallest monetary unit of the specified currency.
        currency:
          $ref: '#/components/schemas/Currency'

    Currency:
      type: string
      description: |
        The alphabetic code that represents the currency.
      enum:
        - AED
        - AFN

    ResponseEntry:
      type: object
      additionalProperties: false
      required:
        - entryId
        - createdOn
        - postings
      properties:
        entryId:
          type: string
          description: Journal entry ID
        createdOn:
          type: string
          format: date-time
          description: Journal entry creation date/time
        postings:
          type: array
          items:
            $ref: '#/components/schemas/ResponsePost'

    NewEntry:
      type: object
      additionalProperties: false
      required:
        - postings
      properties:
        postings:
          type: array
          description: List of posts contained within the journal entry.
          items:
            $ref: '#/components/schemas/Post'
        v1OnlyNewEntryProperty:
          type: string
          description: This is a v1-only property for NewEntry schema.

    Post:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
        - type
        - createdOn
        - accountId
      properties:
        amount:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        type:
          $ref: '#/components/schemas/Type'
        createdOn:
          type: string
          format: date-time
        accountId:
          type: string
          description: account ID

    ResponsePost:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
        - type
        - accountId
        - createdOn
      properties:
        amount:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        type:
          $ref: '#/components/schemas/Type'
        createdOn:
          type: string
          format: date-time
        accountId:
          type: string
          description: account ID

    Type:
      type: string
      description: CREDIT or DEBIT
      enum:
        - CREDIT
        - DEBIT

    CardId:
      type: string
      description: Card identifier
      format: uuid

    Hash:
      type: string
      format: uuid
      example: '15a85f64-5717-4562-b3fc-2c963f66afa6'
      description: UUID derived using @checkdigit/hash

    CardResponse:
      type: object
      additionalProperties: false
      required:
        - dataEncryptionKeyId
        - storageKeyId
        - card
      properties:
        encryptedDataEncryptionKey:
          description: |
            Encrypted DEK matching the publicKeyHash sent in the request. Used to decrypt values in the Card object.
          type: string
        card:
          $ref: '#/components/schemas/Card'

    Card:
      type: object
      additionalProperties: false
      required:
        - last4
        - cardNumber
        - applicationTransactionCounter
      properties:
        last4:
          type: string
          pattern: '^\d+$'
          description: Last four digits of the card number
          minLength: 4
          maxLength: 4
        cardNumber:
          type: string
          description: Encrypted card number (PAN)
        applicationTransactionCounter:
          type: integer
          description: Application transaction counter (ATC) for the card

    NewCardRequest:
      type: object
      required:
        - dataEncryptionKeyId
        - cardNumberLength
        - newCard
      additionalProperties: false
      properties:
        dataEncryptionKeyId:
          $ref: '#/components/schemas/DataEncryptionKeyId'
        cardNumberLength:
          type: integer
          description: Desired number of digits in the card number.
          minimum: 15
          maximum: 19
        newCard:
          $ref: '#/components/schemas/NewCard'

    DataEncryptionKeyId:
      type: string
      description: |
        Reference to encryption keys Payment Card Service will use to encrypt the Card object.
      format: uuid

    NewCard:
      type: object
      additionalProperties: false
      required:
        - serviceCode
        - sequenceNumber
      properties:
        serviceCode:
          type: string
          pattern: '^\d+$'
          description: |
            Used to set general guidelines for how the card can be used, e.g. domestic only or international, online authorizations only, etc.
          minLength: 3
          maxLength: 3
        sequenceNumber:
          type: integer
          description: Used to differentiate issuing the same card and expiration date on multiple plastics.
          minimum: 0
          maximum: 10

  parameters:
    messageId:
      in: path
      name: messageId
      required: true
      schema:
        $ref: '#/components/schemas/MessageId'

    createdOn:
      name: Created-On
      in: header
      description: Sets the created-on timestamp for the newly created record.
      required: true
      schema:
        type: string
        format: date-time

    ifMatch:
      in: header
      name: If-Match
      description: If-Match header
      schema:
        type: string

    at:
      in: query
      name: at
      description: Returns data createdOn before this time.
      required: true
      schema:
        type: string
        format: date-time

    entryId:
      in: path
      name: entryId
      description: Unique identifier for an entry.
      required: true
      schema:
        type: string

    lastModified:
      in: header
      name: Last-Modified
      description: used to set resource creation date.
      required: false
      schema:
        type: string
        format: date-time

    cardId:
      name: cardId
      in: path
      description: An id unique to each card in uuid format
      required: true
      schema:
        $ref: '#/components/schemas/CardId'

    publicKeyHashQuery:
      name: publicKeyHashQuery
      in: query
      description: UUID derived from a PEM formatted Public Key using @checkdigit/hash
      required: false
      schema:
        $ref: '#/components/schemas/Hash'

  requestBodies:
    NewCardRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewCardRequest'

  responses:
    ServerError:
      description: Server Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Ping:
      description: ping successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ping'

    NotFound:
      description: Requested resource not found.

    Conflict:
      description: Conflict

    PreConditionFailed:
      description: Version tag mismatch

    Created:
      description: Created.
      headers:
        Created-On:
          $ref: '#/components/headers/Created-On'
        Updated-On:
          $ref: '#/components/headers/Updated-On'
        Last-Modified:
          $ref: '#/components/headers/Last-Modified'

    PreconditionFailed:
      description: Precondition failed

    CardResponse:
      description: Card retrieved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CardResponse'
      headers:
        Last-Modified:
          $ref: '#/components/headers/Last-Modified'
        Created-On:
          $ref: '#/components/headers/Created-On'
        Updated-On:
          $ref: '#/components/headers/Updated-On'
        ETag:
          $ref: '#/components/headers/ETag'

  headers:
    Created-On:
      description: The created-on timestamp for the record.
      required: true
      schema:
        type: string
        format: date-time

    Updated-On:
      description: The updated-on timestamp for the existing record.
      required: true
      schema:
        type: string
        format: date-time

    Last-Modified:
      description: When the resource was created (all resources are immutable).
      required: true
      schema:
        type: string
        format: date-time

    ETag:
      description: Version information for record
      required: true
      schema:
        type: string
